<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blade Vale — Admin Map</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #0b0e14; color: #e9eef5; font-family: "Trebuchet MS", system-ui, sans-serif; overflow: hidden; }
  #wrap { display: flex; height: 100vh; }
  #stage { flex: 1; position: relative; min-width: 0; }
  #map { display: block; width: 100%; height: 100%; }
  #status { position: absolute; left: 12px; top: 10px; font-size: 12px; letter-spacing: .5px; color: #9fb6d4;
    background: rgba(8,12,20,.6); padding: 5px 10px; border-radius: 6px; }
  #status b { color: #ffd34d; }
  #status .off { color: #ff8a7a; }
  aside { width: 300px; flex: 0 0 300px; background: #0e1320; border-left: 1px solid rgba(125,200,255,.14);
    padding: 14px; overflow-y: auto; }
  h1 { font-size: 15px; letter-spacing: 2px; text-transform: uppercase; color: #bfe0ff; margin-bottom: 2px; }
  .sub { font-size: 11px; color: #7c93b2; margin-bottom: 12px; }
  .sec { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #ffd34d; opacity: .8;
    margin: 14px 0 6px; border-bottom: 1px solid rgba(255,211,77,.2); padding-bottom: 4px; }
  .prow { display: flex; align-items: center; gap: 9px; padding: 6px 4px; border-radius: 6px; font-size: 13px; }
  .prow:nth-child(odd) { background: rgba(255,255,255,.025); }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 12px; box-shadow: 0 0 0 1px rgba(0,0,0,.5); }
  .pname { font-weight: 700; }
  .pmeta { font-size: 11px; color: #88a0c0; }
  .pright { margin-left: auto; text-align: right; font-size: 11px; color: #aebfd6; }
  .empty { font-size: 12px; color: #6f86a4; font-style: italic; padding: 8px 4px; }
  .crow { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 3px 4px; color: #cdddf3; }
  .csq { width: 9px; height: 9px; border-radius: 2px; flex: 0 0 9px; }
  .controls { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 6px; }
  .controls label { font-size: 12px; display: flex; align-items: center; gap: 5px; cursor: pointer; color: #b7c8df; }
  .controls button { font-size: 12px; padding: 5px 10px; border-radius: 6px; cursor: pointer;
    border: 1px solid rgba(255,120,120,.4); background: rgba(255,120,120,.1); color: #ffc4c4; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="map"></canvas>
    <div id="status">connecting…</div>
  </div>
  <aside>
    <h1>Admin Map</h1>
    <div class="sub">Shared world · live overwatch</div>
    <div class="sec">Players <span id="pcount" style="opacity:.6"></span></div>
    <div id="players"><div class="empty">waiting for players…</div></div>
    <div class="sec">Holds</div>
    <div id="caps"><div class="empty">—</div></div>
    <div class="controls">
      <label><input type="checkbox" id="t-disc" checked> Discovered</label>
      <label><input type="checkbox" id="t-trail" checked> Trails</label>
      <label><input type="checkbox" id="t-army" checked> Armies</label>
      <button id="clear">Clear trails</button>
    </div>
  </aside>
</div>
<script>
(function () {
  'use strict';
  var BASE = location.protocol + '//' + (location.hostname || 'localhost') + ':8787/api/v1';
  var POLL_MS = 1500, CORE = 90;       // server clamps the strategic world to ±90
  var CELL = 4, SIGHT = 5;             // discovered-area grid: 4u cells, ~5-cell (20u) sight radius
  var PALETTE = ['#39d0ff', '#ffd34d', '#7dff9a', '#ff7a4a', '#d6a3ff', '#ff6b9d', '#8c9eff', '#c8ff6b', '#ff5a3c', '#5bd6c0'];

  var canvas = document.getElementById('map'), ctx = canvas.getContext('2d');
  var statusEl = document.getElementById('status');
  var world = null, lastOk = 0;
  var colorOf = {};                    // account_id -> color
  var trails = {};                     // account_id -> [{x,z}]
  var discovered = {};                 // account_id -> Set("gx,gz")
  var show = { disc: true, trail: true, army: true };

  document.getElementById('t-disc').onchange = function (e) { show.disc = e.target.checked; render(); };
  document.getElementById('t-trail').onchange = function (e) { show.trail = e.target.checked; render(); };
  document.getElementById('t-army').onchange = function (e) { show.army = e.target.checked; render(); };
  document.getElementById('clear').onclick = function () { trails = {}; discovered = {}; render(); };

  function colorFor(id, idx) { if (!colorOf[id]) colorOf[id] = PALETTE[idx % PALETTE.length]; return colorOf[id]; }
  // a stable colour for an arbitrary faction/owner string
  function hashColor(s) {
    s = String(s || ''); var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return 'hsl(' + (h % 360) + ',55%,60%)';
  }

  function fit() {
    var minX = -CORE - 5, maxX = CORE + 5, minZ = -CORE - 5, maxZ = CORE + 5;
    function inc(x, z) { if (x < minX) minX = x; if (x > maxX) maxX = x; if (z < minZ) minZ = z; if (z > maxZ) maxZ = z; }
    if (world) {
      (world.players || []).forEach(function (p) { inc(p.x, p.z); });
      (world.capitals || []).forEach(function (c) { inc(c.x, c.z); });
      (world.armies || []).forEach(function (a) { inc(a.x, a.z); });
    }
    Object.keys(trails).forEach(function (k) { trails[k].forEach(function (pt) { inc(pt.x, pt.z); }); });
    var W = canvas.width, H = canvas.height, pad = 26 * (window.devicePixelRatio || 1);
    var sx = (W - 2 * pad) / (maxX - minX), sz = (H - 2 * pad) / (maxZ - minZ), s = Math.min(sx, sz);
    var ox = pad + (W - 2 * pad - (maxX - minX) * s) / 2, oz = pad + (H - 2 * pad - (maxZ - minZ) * s) / 2;
    return {
      x: function (wx) { return ox + (wx - minX) * s; },
      y: function (wz) { return oz + (wz - minZ) * s; },
      s: s
    };
  }

  function render() {
    var W = canvas.width, H = canvas.height, t = fit();
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0d1320'; ctx.fillRect(0, 0, W, H);

    // discovered area — accumulated coloured cells per player
    if (show.disc) {
      ctx.globalAlpha = 1;
      Object.keys(discovered).forEach(function (id) {
        ctx.fillStyle = colorOf[id] || '#39d0ff';
        var cells = discovered[id], half = (CELL * t.s) / 2 + 0.5;
        cells.forEach(function (key) {
          var p = key.split(','), gx = +p[0] * CELL, gz = +p[1] * CELL;
          ctx.globalAlpha = 0.05;
          ctx.fillRect(t.x(gx) - half, t.y(gz) - half, half * 2, half * 2);
        });
      });
      ctx.globalAlpha = 1;
    }

    // strategic core bounds (±90)
    ctx.strokeStyle = 'rgba(125,200,255,.18)'; ctx.lineWidth = 1;
    ctx.strokeRect(t.x(-CORE), t.y(-CORE), (2 * CORE) * t.s, (2 * CORE) * t.s);

    // capitals (holds)
    (world && world.capitals || []).forEach(function (c) {
      var x = t.x(c.x), y = t.y(c.z), col = hashColor(c.owner_name || c.def_name);
      ctx.fillStyle = col; ctx.strokeStyle = '#0b0e14'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x, y - 8); ctx.lineTo(x + 8, y); ctx.lineTo(x, y + 8); ctx.lineTo(x - 8, y); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#dfe9f7'; ctx.font = '11px system-ui'; ctx.textAlign = 'center';
      ctx.fillText(c.def_name || ('Hold ' + c.idx), x, y - 12);
    });

    // armies (server warlords)
    if (show.army) (world && world.armies || []).forEach(function (a) {
      var x = t.x(a.x), y = t.y(a.z), r = Math.max(2.5, Math.min(7, 2 + a.size / 18));
      ctx.fillStyle = hashColor(a.faction); ctx.globalAlpha = .8;
      ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
    });

    // player trails
    if (show.trail) Object.keys(trails).forEach(function (id) {
      var tr = trails[id]; if (tr.length < 2) return;
      ctx.strokeStyle = colorOf[id] || '#39d0ff'; ctx.lineWidth = 2; ctx.globalAlpha = .55;
      ctx.beginPath(); ctx.moveTo(t.x(tr[0].x), t.y(tr[0].z));
      for (var i = 1; i < tr.length; i++) ctx.lineTo(t.x(tr[i].x), t.y(tr[i].z));
      ctx.stroke(); ctx.globalAlpha = 1;
    });

    // players — current position + name
    (world && world.players || []).forEach(function (p, i) {
      var col = colorFor(p.account_id, i), x = t.x(p.x), y = t.y(p.z);
      ctx.beginPath(); ctx.arc(x, y, 7, 0, 7); ctx.fillStyle = col; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = '#0b0e14'; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px system-ui'; ctx.textAlign = 'left';
      ctx.shadowColor = '#000'; ctx.shadowBlur = 4;
      ctx.fillText('☆ ' + p.name, x + 11, y + 4);
      ctx.shadowBlur = 0;
    });
  }

  function ingest(w) {
    world = w;
    (w.players || []).forEach(function (p, i) {
      colorFor(p.account_id, i);
      var tr = trails[p.account_id] || (trails[p.account_id] = []);
      var last = tr[tr.length - 1];
      if (!last || Math.abs(last.x - p.x) > 0.6 || Math.abs(last.z - p.z) > 0.6) {
        tr.push({ x: p.x, z: p.z }); if (tr.length > 600) tr.shift();
      }
      var set = discovered[p.account_id] || (discovered[p.account_id] = new Set());
      var cx = Math.round(p.x / CELL), cz = Math.round(p.z / CELL);
      for (var dx = -SIGHT; dx <= SIGHT; dx++) for (var dz = -SIGHT; dz <= SIGHT; dz++)
        if (dx * dx + dz * dz <= SIGHT * SIGHT) set.add((cx + dx) + ',' + (cz + dz));
    });
  }

  function sidePanel() {
    // every inhabitant of the living world is a "player" — human banners AND the server-driven NPC
    // warlords (each a persistent named character). List them all; humans first, marked with ☆.
    var humans = (world && world.players) || [];
    var npcs = (world && world.armies) || [];
    document.getElementById('pcount').textContent = (humans.length + npcs.length) ? '· ' + (humans.length + npcs.length) +
      (humans.length ? ' (' + humans.length + ' human)' : '') : '';
    var ph = document.getElementById('players');
    var rows = humans.map(function (p, i) {
      var col = colorFor(p.account_id, i);
      return '<div class="prow"><span class="dot" style="background:' + col + '"></span>' +
        '<div><div class="pname">☆ ' + esc(p.name) + '</div>' +
        '<div class="pmeta">' + esc(p.faction || 'Your Banner') + ' · human</div></div>' +
        '<div class="pright">' + (p.size | 0) + ' men · ' + Math.round(p.renown || 0) + ' renown<br>' +
        '(' + Math.round(p.x) + ', ' + Math.round(p.z) + ')</div></div>';
    }).concat(npcs.map(function (a) {
      return '<div class="prow"><span class="dot" style="background:' + hashColor(a.faction) + '"></span>' +
        '<div><div class="pname">' + esc(a.name) + '</div>' +
        '<div class="pmeta">' + esc(a.faction || '') + (a.intent ? ' · ' + esc(a.intent) : '') + '</div></div>' +
        '<div class="pright">' + (a.size | 0) + ' men · ' + Math.round(a.renown || 0) + ' renown<br>' +
        '(' + Math.round(a.x) + ', ' + Math.round(a.z) + ')</div></div>';
    }));
    ph.innerHTML = rows.length ? rows.join('') : '<div class="empty">the world is empty — start the server / reseed</div>';
    var caps = (world && world.capitals) || [];
    document.getElementById('caps').innerHTML = caps.length ? caps.map(function (c) {
      return '<div class="crow"><span class="csq" style="background:' + hashColor(c.owner_name || c.def_name) + '"></span>' +
        esc(c.def_name || ('Hold ' + c.idx)) + ' <span style="opacity:.6;margin-left:auto">' + esc(c.owner_name || 'unclaimed') + '</span></div>';
    }).join('') : '<div class="empty">—</div>';
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[<>&]/g, function (c) { return ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' })[c]; }); }

  function poll() {
    fetch(BASE + '/world?since=0', { headers: { 'X-World': 'shared', 'X-Player-Token': 'admin-observer' } })
      .then(function (r) { return r.json(); })
      .then(function (w) {
        lastOk = Date.now(); ingest(w); sidePanel(); render();
        statusEl.innerHTML = 'shared world <b>#' + w.worldId + '</b> · <b>' + ((w.players || []).length) +
          '</b> players · <b>' + ((w.armies || []).length) + '</b> armies · updated ' + new Date().toLocaleTimeString();
      })
      .catch(function () {
        statusEl.innerHTML = '<span class="off">backend unreachable</span> — is <b>node server/index.js</b> running on :8787?';
      });
  }

  function resize() {
    var dpr = window.devicePixelRatio || 1, st = document.getElementById('stage');
    canvas.width = st.clientWidth * dpr; canvas.height = st.clientHeight * dpr;
    render();
  }
  window.addEventListener('resize', resize);
  resize();
  poll(); setInterval(poll, POLL_MS);
})();
</script>
</body>
</html>
