<!doctype html><meta charset=utf-8><title>Blade Vale — char editor</title>
<meta name=viewport content="width=device-width,initial-scale=1">
<style>
  :root{--bg:#23262b;--pnl:#15171acc;--ink:#e6e6e6;--dim:#9aa0a8;--acc:#d8a56a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden}
  canvas{display:block;touch-action:none}
  .pnl{position:fixed;background:var(--pnl);backdrop-filter:blur(6px);border:1px solid #ffffff1a;border-radius:8px;padding:8px 10px}
  #ui{left:10px;top:10px;width:212px;max-height:calc(100vh - 20px);overflow:auto}
  #ui h4{margin:10px 0 5px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600}
  #ui h4:first-child{margin-top:0}
  label{display:flex;align-items:center;gap:6px;padding:1px 0;cursor:pointer;user-select:none}
  label input{accent-color:var(--acc)}
  .row{display:flex;flex-wrap:wrap;gap:4px}
  button{background:#ffffff14;color:var(--ink);border:1px solid #ffffff1f;border-radius:5px;padding:4px 7px;font:inherit;cursor:pointer}
  button:hover{background:#ffffff26}
  button.on{background:var(--acc);color:#1a1a1a;border-color:var(--acc)}
  select{background:#ffffff14;color:var(--ink);border:1px solid #ffffff1f;border-radius:5px;padding:3px 5px;font:inherit;width:100%}
  input[type=range]{width:100%;accent-color:var(--acc)}
  #stat{right:10px;top:10px;min-width:210px;white-space:pre;font-size:11px;color:var(--dim)}
  #stat b{color:var(--ink);font-weight:600}
  #hint{left:50%;bottom:10px;transform:translateX(-50%);color:var(--dim);padding:5px 12px}
  .k{color:var(--acc)}
  .sm{color:var(--dim);font-size:11px}
</style>
<body>
<div id=ui class=pnl>
  <h4>motion</h4>
  <select id=mo><option value="">— none (the pose below) —</option></select>
  <div class=row style=margin-top:4px><button id=mo_play style=min-width:52px>pause</button><button id=mo_prev title="a frame back">◀</button><button id=mo_next title="a frame on">▶</button></div>
  <label class=sm>frame <span id=v_mof>–</span></label><input type=range id=s_mof min=0 max=0 value=0>
  <label class=sm>speed <span id=v_mos>1.00×</span></label><input type=range id=s_mos min=5 max=150 value=100>
  <div class=sm id=mo_info></div>
  <h4>pose</h4>
  <div class=row><button id=p_bind class=on>bind</button><button id=p_a>A</button><button id=p_t>T</button></div>
  <label class=sm><span id=l_arm>arms down</span> <span id=v_arm>0°</span></label><input type=range id=s_arm min=-90 max=90 value=0>
  <label class=sm>legs apart <span id=v_leg>0°</span></label><input type=range id=s_leg min=-20 max=30 value=0>
  <h4>show</h4>
  <div id=meshlist></div>
  <h4>items</h4>
  <div class=sm style="margin-bottom:4px">wrists: leather bands (always)</div>
  <label><span style="width:64px;display:inline-block">gauntlet</span><input type=checkbox id=i_gauntlet_L> L <input type=checkbox id=i_gauntlet_R style=margin-left:8px> R</label>
  <label><span style="width:64px;display:inline-block">shoulder <span class=sm>leather</span></span><input type=checkbox id=i_pauldron_L> L <input type=checkbox id=i_pauldron_R style=margin-left:8px> R</label>
  <label><span style="width:64px;display:inline-block">helmet</span><input type=checkbox id=i_helmet></label>
  <h4>shading</h4>
  <select id=shade>
    <option value=tex>textured (atlas)</option>
    <option value=clay selected>clay — judge the form</option>
    <option value=norm>normals</option>
    <option value=cls>vertex classes</option>
    <option value=sil>silhouette</option>
  </select>
  <label><input type=checkbox id=t_wire> wireframe over</label>
  <label><input type=checkbox id=t_smooth checked> smooth normals</label>
  <label><input type=checkbox id=t_double> double-sided (find flipped faces)</label>
  <label><input type=checkbox id=t_bones> skeleton</label>
  <label><input type=checkbox id=t_grid checked> grid + ruler</label>
  <h4>isolate</h4>
  <select id=iso><option value="">— whole body —</option></select>
  <h4>camera</h4>
  <div class=row>
    <button data-v="0">front</button><button data-v="180">back</button>
    <button data-v="90">left</button><button data-v="-90">right</button>
    <button data-v="35">3/4</button><button id=c_reset>reset</button>
  </div>
  <div class=row style=margin-top:4px>
    <button data-z=head>head</button><button data-z=torso>torso</button>
    <button data-z=hands>hands</button><button data-z=legs>legs</button><button data-z=feet>feet</button>
  </div>
  <label style=margin-top:6px><input type=checkbox id=t_spin> turntable</label>
  <h4>light</h4>
  <label class=sm>key angle <span id=v_key>35°</span></label><input type=range id=s_key min=-180 max=180 value=35>
  <label class=sm>exposure <span id=v_exp>1.0</span></label><input type=range id=s_exp min=40 max=200 value=100>
</div>
<div id=stat class=pnl>loading…</div>
<div id=hint class=pnl><span class=k>drag</span> turn · <span class=k>wheel</span> zoom · <span class=k>right/shift-drag</span> move · <span class=k>double-click</span> centre here</div>
<script src="../../vendor/three.min.js?v=r128"></script>
<script>
const q = new URLSearchParams(location.search);
// THE CHAR: the game's own rig, exactly as it ships (assets/rigs/base — dress.js writes it). ?rig=<path> points at a
// build you are testing before it ships. The PAINTED atlas lives here beside the editor: the shipped atlas.jpg has its
// skin normalised for the game's tints (headbake.py), and the game paints the tone back on — the editor has no look
// system, so it shows the paint the sculpt was made with.
const DIR = q.get('rig') || '../../assets/rigs/base', RAW = 'items/atlas_raw.jpg';   // (beside this page, not under the rig: the painted atlas is the editor's, and assets/ is what players download)
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setPixelRatio(Math.min(devicePixelRatio, 2)); r.setSize(innerWidth, innerHeight);
r.outputEncoding = THREE.sRGBEncoding; r.physicallyCorrectLights = false;
document.body.appendChild(r.domElement);

const s = new THREE.Scene(); s.background = new THREE.Color(0x23262b);
const c = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.01, 200);

// ---- lights
const hemi = new THREE.HemisphereLight(0xdfe6f0, 0x3a3630, 0.55); s.add(hemi);
const key = new THREE.DirectionalLight(0xfff2e2, 1.15); key.position.set(2, 3.4, 3); s.add(key);
const fill = new THREE.DirectionalLight(0xbfd4ff, 0.34); fill.position.set(-3, 1.6, -1.5); s.add(fill);
const rim = new THREE.DirectionalLight(0xffffff, 0.5); rim.position.set(-1.2, 2.4, -3.4); s.add(rim);

// ---- ground
const gnd = new THREE.Group(); s.add(gnd);
gnd.add(new THREE.GridHelper(6, 24, 0x4a4f57, 0x33373d));
(function ruler() {
  const g = new THREE.Group(); g.position.set(0.85, 0, 0);
  const pts = [new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 2.2, 0)];
  g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0x5a6069 })));
  for (let y = 0; y <= 2.2001; y += 0.1) {
    const big = Math.abs(y * 2 % 1) < 1e-6, w = big ? 0.07 : 0.035;
    const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-w, y, 0), new THREE.Vector3(0, y, 0)]),
      new THREE.LineBasicMaterial({ color: big ? 0x8b939c : 0x545a62 }));
    g.add(l);
  }
  gnd.add(g);
})();

let az = (+q.get('az') || 28) * Math.PI / 180, el = (+q.get('el') || 4) * Math.PI / 180;
let dist = +q.get('d') || 5.2, tgt = new THREE.Vector3(0, +q.get('cy') || 1.04, 0);
function cam() {
  c.position.set(tgt.x + Math.sin(az) * Math.cos(el) * dist, tgt.y + Math.sin(el) * dist, tgt.z + Math.cos(az) * Math.cos(el) * dist);
  c.lookAt(tgt);
}
cam();

// ---- glTF (skinned, bind pose from the inverse bind matrices — same as the game's instanceModelRig)
async function loadGltf(dir) {
  const g = await (await fetch(dir + '/scene.gltf?' + Date.now())).json();
  const bin = await (await fetch(dir + '/' + g.buffers[0].uri + '?' + Date.now())).arrayBuffer();
  const CT = { 5121: Uint8Array, 5123: Uint16Array, 5125: Uint32Array, 5126: Float32Array }, NC = { SCALAR: 1, VEC2: 2, VEC3: 3, VEC4: 4, MAT4: 16 };
  const acc = i => { const a = g.accessors[i], bv = g.bufferViews[a.bufferView], T = CT[a.componentType], n = NC[a.type]; return new T(bin, (bv.byteOffset || 0) + (a.byteOffset || 0), a.count * n); };
  const raw = await fetch(RAW, { method: 'HEAD' }).then(r => r.ok, () => false);
  const texs = (g.images || []).map(im => { const t = new THREE.TextureLoader().load(im.uri === 'atlas.jpg' && raw ? RAW : dir + '/' + im.uri); t.flipY = false; t.encoding = THREE.sRGBEncoding; if (im.uri === 'leather_tile.png') t.wrapS = t.wrapT = THREE.RepeatWrapping; return t; });
  const atlasImage = await new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = dir + '/' + ((g.images || [])[0] || {}).uri; });
  const mats = (g.materials || []).map(m => {
    const p = m.pbrMetallicRoughness || {};
    const mm = new THREE.MeshStandardMaterial({ roughness: p.roughnessFactor != null ? p.roughnessFactor : 0.9, metalness: 0, skinning: true, side: m.doubleSided ? THREE.DoubleSide : THREE.FrontSide });
    if (p.baseColorTexture) mm.map = texs[g.textures[p.baseColorTexture.index].source];
    if (m.alphaMode === 'MASK') { mm.alphaTest = m.alphaCutoff || 0.5; mm.transparent = false; }
    mm.name = m.name; return mm;
  });
  const nodes = g.nodes.map(n => { const b = new THREE.Bone(); b.name = n.name; if (n.matrix) new THREE.Matrix4().fromArray(n.matrix).decompose(b.position, b.quaternion, b.scale); return b; });
  const parent = new Array(nodes.length).fill(-1);
  g.nodes.forEach((n, i) => (n.children || []).forEach(ch => { parent[ch] = i; nodes[i].add(nodes[ch]); }));
  const root = new THREE.Group();
  g.nodes.forEach((n, i) => { if (parent[i] < 0 && n.mesh == null) root.add(nodes[i]); });
  const order = []; const dfs = i => { order.push(i); (g.nodes[i].children || []).forEach(dfs); }; g.nodes.forEach((n, i) => { if (parent[i] < 0) dfs(i); });
  const worldM = new Map();
  for (const n of g.nodes) {
    if (n.mesh == null) continue; const sk = g.skins[n.skin], ibm = acc(sk.inverseBindMatrices);
    sk.joints.forEach((j, k) => { if (!worldM.has(j)) { const m = new THREE.Matrix4().fromArray(ibm, k * 16).invert(); if (m.elements.every(Number.isFinite) && Math.abs(m.determinant()) > 1e-6) worldM.set(j, m); } });
  }
  const worldOf = new Map();
  for (const i of order) {
    let wm = worldM.get(i); const pw = parent[i] >= 0 ? worldOf.get(parent[i]) : null;
    if (!wm) wm = pw ? pw.clone().multiply(nodes[i].matrix) : nodes[i].matrix.clone();
    const local = pw ? pw.clone().invert().multiply(wm) : wm.clone();
    local.decompose(nodes[i].position, nodes[i].quaternion, nodes[i].scale); nodes[i].updateMatrix(); worldOf.set(i, wm.clone());
  }
  const meshes = [];
  for (const n of g.nodes) {
    if (n.mesh == null) continue;
    const p = g.meshes[n.mesh].primitives[0], geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(acc(p.attributes.POSITION), 3));
    if (p.attributes.NORMAL != null) geo.setAttribute('normal', new THREE.BufferAttribute(acc(p.attributes.NORMAL), 3)); else geo.computeVertexNormals();
    if (p.attributes.TEXCOORD_0 != null) geo.setAttribute('uv', new THREE.BufferAttribute(acc(p.attributes.TEXCOORD_0), 2));
    geo.setAttribute('skinIndex', new THREE.BufferAttribute(acc(p.attributes.JOINTS_0), 4));
    geo.setAttribute('skinWeight', new THREE.BufferAttribute(acc(p.attributes.WEIGHTS_0), 4));
    geo.setIndex(new THREE.BufferAttribute(acc(p.indices), 1));
    const sk = g.skins[n.skin], ibm = acc(sk.inverseBindMatrices);
    const sm = new THREE.SkinnedMesh(geo, mats[p.material || 0]); sm.name = n.name; sm.frustumCulled = false; root.add(sm);
    const bones = sk.joints.map(j => nodes[j]), inv = bones.map((b, k) => { const m = new THREE.Matrix4().fromArray(ibm, k * 16); return m.elements.every(Number.isFinite) ? m : new THREE.Matrix4(); });
    sm.bind(new THREE.Skeleton(bones, inv), new THREE.Matrix4());
    meshes.push(sm);
  }
  root.updateMatrixWorld(true);
  return { g, root, nodes, parent, meshes, worldOf, atlasImage };
}

const CLS_COL = [0xffd8a8, 0x4a3524, 0x8a5a2e, 0x6b4a2a, 0x2b2b3a, 0xf2f2f2, 0xd88a6a, 0x7fd1ff, 0x5ab0e0, 0x9ae06a, 0x7fc24a, 0xffd24a, 0xe0b030, 0xff8f8f, 0xe06a6a, 0xc08aff, 0xa06ae0, 0x8affd8, 0x5ae0b0];
let M, BODY, PIECES, BONE = {}, REST = new Map();
const NAMES = ['base'], MODELS = [];   // the editor shows ONE character: the base, dressed from the ITEMS panel

(async () => {
  for (let i = 0; i < NAMES.length; i++) {
    const mm = await loadGltf(DIR);
    mm.key = NAMES[i]; s.add(mm.root); MODELS.push(mm);
    try { mm.pieces = await (await fetch(DIR + '/pieces.json?' + Date.now())).json(); } catch (e) { mm.pieces = null; }
  }
  M = MODELS[0]; PIECES = M.pieces || {};
  await seatSword(M);
  BODY = M.meshes.find(m => m.name === 'base_body' || /_body$/.test(m.name));
  M.nodes.forEach(n => { BONE[n.name] = n; REST.set(n.name, { p: n.position.clone(), q: n.quaternion.clone() }); });

  // keep the original material of each mesh, plus the swap materials
  for (const m of ALL()) {
    if (m.userData.helm) continue;
    m.userData.tex = m.material;
    m.userData.clay = new THREE.MeshStandardMaterial({ color: 0xc8c3bb, roughness: 0.62, metalness: 0, skinning: true });
    m.userData.norm = new THREE.MeshNormalMaterial({ skinning: true });
    m.userData.sil = new THREE.MeshBasicMaterial({ color: 0x14161a, skinning: true });
    m.userData.smooth = m.geometry.getAttribute('normal').clone();
    const flat = m.geometry.clone().toNonIndexed(); flat.computeVertexNormals();
    m.userData.flatGeo = flat;
    m.userData.idxGeo = m.geometry;
  }
  // vertex classes on the body
  if (BODY && PIECES.body && PIECES.body.vclass) {
    const vc = PIECES.body.vclass, n = BODY.geometry.getAttribute('position').count, col = new Uint8Array(n * 3);
    for (let v = 0; v < n; v++) { const k = new THREE.Color(CLS_COL[vc[v] % CLS_COL.length]); col[v * 3] = k.r * 255; col[v * 3 + 1] = k.g * 255; col[v * 3 + 2] = k.b * 255; }
    BODY.geometry.setAttribute('color', new THREE.BufferAttribute(col, 3, true));
    BODY.userData.cls = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.8, metalness: 0, skinning: true });
    const isoSel = document.getElementById('iso');
    PIECES.body.classes.forEach((nm, i) => { const o = document.createElement('option'); o.value = i; o.textContent = nm; isoSel.appendChild(o); });
  }
  for (const mm of MODELS) { mm.skel = new THREE.SkeletonHelper(mm.root); mm.skel.visible = false; mm.skel.material.depthTest = false; mm.skel.renderOrder = 9; s.add(mm.skel); }
  for (const mm of MODELS) await loadHelm(mm);
  for (const mm of MODELS) dressPauldrons(mm);
  buildMeshList();
  applyShade(); applyShow(); measure();
  await loadMotions();
  window.__ready = true;
})();

// ---- the sword in his fist: items/sword_grip.json (tools/realmesh/base/grip.js) is a bind-space seat for the rig's sword —
// the grip laid through the tunnel his closed fingers make, blade out of the thumb side. The rig still carries the sword
// where the OLD warrior's hand held it (upright, 10 cm off the wrist); until the seat is baked into assets/rigs/base the
// editor lays it on at load. ?rawsword=1 shows the rig's own.
async function seatSword(mm) {
  if (q.get('rawsword')) return;
  let j; try { j = await (await fetch('items/sword_grip.json?' + Date.now())).json(); } catch (e) { return; }
  const m = mm.meshes.find(x => x.name === j.mesh); if (!m || m.userData.seated) return;
  const S = new THREE.Matrix4().fromArray(j.matrix), N = new THREE.Matrix3().getNormalMatrix(S), g = m.geometry;
  g.getAttribute('position').applyMatrix4(S); if (g.getAttribute('normal')) g.getAttribute('normal').applyNormalMatrix(N);
  g.computeBoundingBox(); g.computeBoundingSphere(); m.userData.seated = j;
}

// ---- the helm: helm_corinthian.json + .bin (positions, normals, uvs, u16 indices, already fitted to the base head in
// the bind pose, with its own maps). It rides the head bone as a plain mesh, so it turns with the head when posed.
async function loadHelm(mm) {
  try {
    const dir = DIR, j = await (await fetch(dir + '/helm_corinthian.json?' + Date.now())).json();
    const bin = await (await fetch(dir + '/helm_corinthian.bin?' + Date.now())).arrayBuffer();
    const nv = j.verts, nt = j.tris; let off = 0;
    const pos = new Float32Array(bin, off, nv * 3); off += nv * 12;
    const nrm = new Float32Array(bin, off, nv * 3); off += nv * 12;
    const uv = new Float32Array(bin, off, nv * 2); off += nv * 8;
    const idx = new Uint16Array(bin, off, nt * 3);
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('normal', new THREE.BufferAttribute(nrm, 3)); g.setAttribute('uv', new THREE.BufferAttribute(uv, 2)); g.setIndex(new THREE.BufferAttribute(idx, 1));
    const tex = nm => { const t = new THREE.TextureLoader().load(dir + '/' + j.textures[nm]); t.flipY = true; return t; };
    const map = tex('color'); map.encoding = THREE.sRGBEncoding;
    const mat = new THREE.MeshStandardMaterial({ map, normalMap: tex('normal'), roughnessMap: tex('rough'), aoMap: tex('occl'), metalness: 0.35, roughness: 1 });   /* the asset says metalness 1, but a full metal with no environment map draws BLACK in three; the game lights it its own way */
    const head = mm.nodes.find(n => n.name === 'head');
    const mesh = new THREE.Mesh(g, mat); mesh.name = 'helmet'; mesh.frustumCulled = false;
    if (head) { head.updateMatrixWorld(true); mesh.applyMatrix4(head.matrixWorld.clone().invert()); head.add(mesh); } else mm.root.add(mesh);
    mesh.userData.helm = true; mm.meshes.push(mesh);
  } catch (e) { console.warn('no helm for', mm.key, e.message); }
}
// ---- ARMOUR PARTS — a generator. Give it any fitted plate (an open shell over a rim) and it returns a finished piece:
// the plate's edge raised into a bevelled BORDER like the cuff of the steel arm, the underside closed flat, and the
// whole thing painted with a TILE repeated at world scale — a rib every few centimetres however big the piece.
// STYLES: every piece is built in one of these, and every piece in a style looks the same way. `leather` is what the
// user signed off on the shoulder plate on 2026-09-20 ("current texture of the shoulder armor should be called the
// leather version"): the ribbed tile off the gauntlet's sheet, ribs laid along the plate's own lames, soft sheen. An
// `iron` style is to come later — do not change `leather`; add beside it.
const STYLES = {
  leather: { out: 0.015, up: 0.008, down: 0.020, tuck: 0.010, tileU: 0.10, tileV: 0.04, roughness: 0.62, metalness: 0.25 }
};
let STEEL = null;   // the tile: the silver ribbed column of Thor's Equip_03, cropped out of the atlas once
function steelTile(mm) {
  if (STEEL) return STEEL;
  const img = mm.atlasImage; if (!img) return null;
  const S = img.width / 2048, cv = document.createElement('canvas'); cv.width = 128; cv.height = 64;
  // atlas px: the Equip_03 slot is [0.25, 0.625] x [0.25, 0.25]; the silver column sits at source u 0.84..0.98, v 0.05..0.36
  const sx = (0.25 + 0.86 * 0.25) * 2048 * S, sy = (0.625 + 0.09 * 0.25) * 2048 * S, sw = 0.10 * 0.25 * 2048 * S, sh = 0.057 * 0.25 * 2048 * S;   // inside one plate, exactly ONE rib period (the column's ribs sit 58 px apart on the 1024 sheet), so it tiles both ways
  cv.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, 128, 64);
  STEEL = new THREE.CanvasTexture(cv); STEEL.wrapS = STEEL.wrapT = THREE.RepeatWrapping; STEEL.encoding = THREE.sRGBEncoding; STEEL.anisotropy = 4;
  return STEEL;
}
function armorPart(mm, m, ax, o = {}) {
  const ST = STYLES[o.style || 'leather']; o = Object.assign({}, ST, o);
  const RIM_OUT = o.out, RIM_UP = o.up, RIM_DOWN = o.down, RIM_IN = o.tuck;   // metres
  const TILE_U = o.tileU, TILE_V = o.tileV;   // one repeat of the steel: 10 cm along a rib, 4 cm from rib to rib — the gauntlet's pitch
  const g = m.geometry, pos = g.getAttribute('position'), idx = Array.from(g.index.array);
  // new vertices go into plain arrays, then everything is rebuilt as one geometry
  const P = [], UV = [], JI = [], JW = [], N = pos.count;
  const A = { ji: g.getAttribute('skinIndex'), jw: g.getAttribute('skinWeight') };
  for (let v = 0; v < N; v++) { P.push([pos.getX(v), pos.getY(v), pos.getZ(v)]); UV.push([0, 0]); JI.push([A.ji.getX(v), A.ji.getY(v), A.ji.getZ(v), A.ji.getW(v)]); JW.push([A.jw.getX(v), A.jw.getY(v), A.jw.getZ(v), A.jw.getW(v)]); }
  const add = (p, uv, from) => { P.push(p); UV.push(uv); JI.push(JI[from]); JW.push(JW[from]); return P.length - 1; };
  const used = [...new Set(idx)]; const C = [0, 0, 0]; for (const v of used) { C[0] += P[v][0] / used.length; C[1] += P[v][1] / used.length; C[2] += P[v][2] / used.length; }
  // the plate's own frame in its plane: long axis by PCA

  const mode = el$('shade').value; BODY.material = BODY.userData[mode] || BODY.userData.tex;
}
['t_bones', 't_grid'].forEach(id => el$(id).onchange = applyShow);
['i_gauntlet_L', 'i_gauntlet_R', 'i_pauldron_L', 'i_pauldron_R', 'i_helmet'].forEach(id => el$(id).onchange = applyItems);
['shade', 't_wire', 't_smooth', 't_double'].forEach(id => el$(id).onchange = applyShade);
el$('iso').onchange = () => { if (el$('iso').value === '') { applyShadeBodyOnly(); } else isolate(); };

// ---- pose
function setPose(arm, leg) {
  const put = (name, ax, ang) => { const b = BONE[name]; if (!b) return; const rest = REST.get(name); b.quaternion.copy(rest.q).multiply(new THREE.Quaternion().setFromAxisAngle(ax, ang)); };
  const X = new THREE.Vector3(1, 0, 0), Z = new THREE.Vector3(0, 0, 1);
  put('armL', Z, -arm); put('armR', Z, arm);
  put('thighL', Z, leg); put('thighR', Z, -leg);
  M.root.updateMatrixWorld(true);
}
// …and OVER a clip: the same two turns laid on top of whatever frame is playing, so the carriage of the arms (and the width
// of the stride) can be tried while he walks. Taken in the PARENT's frame — about the axis the bone's own Z has at rest,
// i.e. fore-and-aft through the shoulder — and not about the bone's own Z as it is now: once the clip has swung and twisted
// the upper arm, its own Z is no longer "out from the body". On the bind pose the two are the same turn.
const poseQ = new THREE.Quaternion(), poseAx = new THREE.Vector3();
function poseOver(arm, leg) {
  const over = (name, ang) => { const b = BONE[name]; if (!b || !ang) return; poseAx.set(0, 0, 1).applyQuaternion(REST.get(name).q); b.quaternion.premultiply(poseQ.setFromAxisAngle(poseAx, ang)); };
  over('armL', -arm); over('armR', arm); over('thighL', leg); over('thighR', -leg);
}
// THE ARM CARRIAGE. Over a clip the arm slider is a knob, −10…+10, across the only turns that make sense on HIM (the user,
// 2026-09-20, on the angry walk): −33° over the clip = his arms 45° open, −8° = as close as they go — past −6° the arms are
// in his lats and "make no sense at all"; −12…−8 looks best, so the knob rests at +8 (−10.5°). A clip retargeted from a
// slighter man always carries the arms too close for this build: that is what the knob is for. The knob is remembered
// (this browser) so the next clip is first seen with the same carriage.
const CARRY = { open: -33, close: -8, def: 8 }, carryDeg = k => CARRY.open + (k + 10) / 20 * (CARRY.close - CARRY.open);
let armA = 0, legA = 0, carry = CARRY.def; try { const v = parseFloat(localStorage.getItem('chared-carry')); if (v >= -10 && v <= 10) carry = v; } catch (e) {}
function armSlider() {                              // one slider, two jobs: degrees on the bind pose, the carriage knob over a clip
  const sl = el$('s_arm'), on = !!MO.clip; sl.min = on ? -10 : -90; sl.max = on ? 10 : 90; sl.step = on ? 0.5 : 1; sl.value = on ? carry : armA;
  el$('l_arm').textContent = on ? 'arm carriage' : 'arms down'; ['p_bind', 'p_a', 'p_t'].forEach(i => { el$(i).disabled = on; el$(i).style.opacity = on ? 0.4 : ''; });
}
function pose() {
  if (MO.clip) { applyMotion(MO.t * MO.clip.fps); el$('v_arm').textContent = (carry > 0 ? '+' : '') + carry.toFixed(1) + ' (' + carryDeg(carry).toFixed(1) + '°)'; el$('v_arm').title = carryDeg(carry).toFixed(1) + '° over the clip'; el$('v_leg').textContent = (legA > 0 ? '+' : '') + legA.toFixed(0) + '° over the clip'; }
  else { setPose(armA * Math.PI / 180, legA * Math.PI / 180); el$('v_arm').textContent = armA.toFixed(0) + '°'; el$('v_leg').textContent = legA.toFixed(0) + '°'; }
}
el$('s_arm').oninput = e => { if (MO.clip) { carry = +e.target.value; try { localStorage.setItem('chared-carry', carry); } catch (er) {} } else armA = +e.target.value; pose(); };
el$('s_leg').oninput = e => { legA = +e.target.value; pose(); };
function preset(a, l, btn) { armA = a; legA = l; el$('s_arm').value = a; el$('s_leg').value = l; pose(); ['p_bind', 'p_a', 'p_t'].forEach(i => el$(i).classList.toggle('on', i === btn)); }
el$('p_bind').onclick = () => preset(0, 0, 'p_bind');
el$('p_a').onclick = () => preset(-30, 8, 'p_a');
el$('p_t').onclick = () => preset(-65, 0, 'p_t');

// ---- motion: clips retargeted onto THIS rig by tools/realmesh/base/motion.js — motions/index.json lists them, one file a
// clip: a local quaternion per moving bone per frame and the pelvis' place. A clip owns the skeleton while it is picked and
// the pose sliders turn into an OFFSET over it (poseOver: the arms' becomes the CARRIAGE knob, the legs' is zeroed when a
// clip is picked); on "none" they pose him again.
const MO = { list: [], clip: null, t: 0, play: true, speed: 1, last: 0 }, moQa = new THREE.Quaternion(), moQb = new THREE.Quaternion();
async function loadMotions() {
  try { MO.list = await (await fetch('motions/index.json?' + Date.now())).json(); } catch (e) { MO.list = []; }
  for (const m of MO.list) { const o = document.createElement('option'); o.value = m.id; o.textContent = m.name + '  ·  ' + (m.frames / m.fps).toFixed(2) + ' s' + (m.loop ? ' loop' : ''); el$('mo').appendChild(o); }
  if (q.get('motion')) setMotion(q.get('motion'));
}
function restPose() { for (const [nm, r0] of REST) { const b = BONE[nm]; if (b && b.isBone) { b.position.copy(r0.p); b.quaternion.copy(r0.q); } } pose(); }
async function setMotion(id) {
  el$('mo').value = id || ''; MO.clip = null; if (id) preset(0, 0, 'p_bind'); restPose();
  if (id) { const c = await (await fetch('motions/' + id + '.json?' + Date.now())).json(); c.q = c.q.map(a => new Float32Array(a)); c.pos = new Float32Array(c.pos); MO.clip = c; MO.t = 0; MO.play = true; }
  const c = MO.clip; el$('s_mof').max = c ? c.frames - 1 : 0; el$('mo_play').textContent = 'pause';
  el$('mo_info').textContent = c ? c.bones.length + ' bones · ' + c.frames + ' frames @ ' + c.fps + (c.credit ? ' · ' + c.credit : '') : '';
  if (!c) { el$('v_mof').textContent = '–'; el$('s_mof').value = 0; } armSlider(); pose();
}
function applyMotion(tf) {                          // tf in frames, fractional: slerp between the two around it
  const c = MO.clip, n = c.frames, f = c.loop ? ((tf % n) + n) % n : Math.min(Math.max(tf, 0), n - 1), i0 = Math.floor(f), a = f - i0, i1 = c.loop ? (i0 + 1) % n : Math.min(i0 + 1, n - 1);
  c.bones.forEach((nm, k) => { const b = BONE[nm]; if (!b) return; moQa.fromArray(c.q[k], i0 * 4); moQb.fromArray(c.q[k], i1 * 4); b.quaternion.copy(moQa).slerp(moQb, a); });
  poseOver(carryDeg(carry) * Math.PI / 180, legA * Math.PI / 180);
  const rb = BONE[c.root]; if (rb) rb.position.set(c.pos[i0 * 3] + (c.pos[i1 * 3] - c.pos[i0 * 3]) * a, c.pos[i0 * 3 + 1] + (c.pos[i1 * 3 + 1] - c.pos[i0 * 3 + 1]) * a, c.pos[i0 * 3 + 2] + (c.pos[i1 * 3 + 2] - c.pos[i0 * 3 + 2]) * a);
  el$('v_mof').textContent = f.toFixed(1) + ' / ' + (n - 1); el$('s_mof').value = i0;
}
function stepMotion(now) { const dt = Math.min(0.1, (now - MO.last) / 1000 || 0); MO.last = now; const c = MO.clip; if (!c || !MO.play) return; MO.t += dt * MO.speed; if (!c.loop && MO.t * c.fps >= c.frames - 1) MO.t = 0; applyMotion(MO.t * c.fps); }
function moFrame(f) { const c = MO.clip; if (!c) return; MO.play = false; el$('mo_play').textContent = 'play'; MO.t = (c.loop ? ((f % c.frames) + c.frames) % c.frames : Math.min(Math.max(f, 0), c.frames - 1)) / c.fps; applyMotion(MO.t * c.fps); }
el$('mo').onchange = e => setMotion(e.target.value);
el$('mo_play').onclick = () => { if (!MO.clip) return; MO.play = !MO.play; el$('mo_play').textContent = MO.play ? 'pause' : 'play'; };
el$('mo_prev').onclick = () => MO.clip && moFrame(Math.round(MO.t * MO.clip.fps) - 1);
el$('mo_next').onclick = () => MO.clip && moFrame(Math.round(MO.t * MO.clip.fps) + 1);
el$('s_mof').oninput = e => moFrame(+e.target.value);
el$('s_mos').oninput = e => { MO.speed = +e.target.value / 100; el$('v_mos').textContent = MO.speed.toFixed(2) + '×'; };

// ---- measurements (bind pose, the body mesh)
function measure() {
  if (!BODY || !PIECES.body) { el$('stat').textContent = 'base  ' + (ALL().filter(m => m.visible).reduce((a, m) => a + m.geometry.index.count / 3, 0) | 0) + ' tris shown'; return; }
  const pos = BODY.geometry.getAttribute('position'), vc = PIECES.body && PIECES.body.vclass, names = PIECES.body ? PIECES.body.classes : [];
  const ci = n => names.indexOf(n);
  let top = -9, bot = 9;
  const ext = {};
  for (let v = 0; v < pos.count; v++) {
    const x = pos.getX(v), y = pos.getY(v), z = pos.getZ(v);
    top = Math.max(top, y); bot = Math.min(bot, y);
    const k = vc ? vc[v] : -1; const e = ext[k] || (ext[k] = { x0: 9, x1: -9, y0: 9, y1: -9, z0: 9, z1: -9 });
    e.x0 = Math.min(e.x0, x); e.x1 = Math.max(e.x1, x); e.y0 = Math.min(e.y0, y); e.y1 = Math.max(e.y1, y); e.z0 = Math.min(e.z0, z); e.z1 = Math.max(e.z1, z);
  }
  for (const mm of ALL()) { if (!mm.visible) continue; mm.geometry.computeBoundingBox(); top = Math.max(top, mm.geometry.boundingBox.max.y); bot = Math.min(bot, mm.geometry.boundingBox.min.y); }   /* his legs are their own mesh now: the height has to see them */
  const H = top - bot;
  const head = ext[ci('head')] || { y0: 0, y1: 0 };
  const headH = head.y1 - head.y0;
  // a band round the torso: 32 sectors about the body axis -> width, depth and a polygon girth
  const band = (y, half) => {
    const R = new Array(32).fill(0); let x0 = 9, x1 = -9, z0 = 9, z1 = -9, n = 0;
    for (let v = 0; v < pos.count; v++) {
      const k = vc ? vc[v] : -1; if (names[k] !== 'torso') continue;
      const yy = pos.getY(v); if (Math.abs(yy - y) > half) continue;
      const x = pos.getX(v), z = pos.getZ(v); n++;
      x0 = Math.min(x0, x); x1 = Math.max(x1, x); z0 = Math.min(z0, z); z1 = Math.max(z1, z);
      const a = Math.atan2(z, x), i = ((Math.round(a / (Math.PI * 2) * 32) % 32) + 32) % 32;
      R[i] = Math.max(R[i], Math.hypot(x, z));
    }
    const A = n ? (x1 - x0) / 2 : 0, B = n ? (z1 - z0) / 2 : 0;   /* Ramanujan's ellipse perimeter reads truer than a 32-spoke polygon on a coarse mesh */
    const g = Math.PI * (3 * (A + B) - Math.sqrt((3 * A + B) * (A + 3 * B)));
    return { w: n ? x1 - x0 : NaN, d: n ? z1 - z0 : NaN, g, n };
  };
  const wp = n => { const b = BONE[n]; if (!b) return null; return new THREE.Vector3().setFromMatrixPosition(b.matrixWorld); };
  const d = (a, b) => (a && b) ? a.distanceTo(b) : NaN;
  const sh = wp('armR'), elb = wp('foreR'), wr = wp('handR'), hip = wp('thighR'), kn = wp('shinR'), ft = wp('footR');
  const chest = band(bot + H * 0.72, H * 0.02), waist = band(bot + H * 0.62, H * 0.02), hips = band(bot + H * 0.53, H * 0.02);
  const cm = m => (m * 100).toFixed(1);
  const tris = ALL().filter(m => m.visible).reduce((a, m) => a + m.geometry.index.count / 3, 0) | 0;
  el$('stat').innerHTML =
    `<b>the base</b>  ${tris} tris shown\n` +
    `height        <b>${cm(H)}</b> cm\n` +
    `head length   <b>${cm(headH)}</b> cm\n` +
    `heads tall    <b>${(H / headH).toFixed(2)}</b>  (ideal 7.5–8)\n` +
    `shoulder span <b>${cm(sh ? Math.abs(sh.x) * 2 : NaN)}</b> cm (joints)\n` +
    `chest  w×d/g  ${cm(chest.w)} × ${cm(chest.d)} / <b>${cm(chest.g)}</b>\n` +
    `waist  w×d/g  ${cm(waist.w)} × ${cm(waist.d)} / <b>${cm(waist.g)}</b>\n` +
    `hips   w×d/g  ${cm(hips.w)} × ${cm(hips.d)} / <b>${cm(hips.g)}</b>\n` +
    `chest / waist <b>${(chest.g / waist.g).toFixed(2)}</b>  (ideal 1.25–1.35)\n` +
    `upper arm     ${cm(d(sh, elb))} cm\n` +
    `forearm       ${cm(d(elb, wr))} cm\n` +
    `arm total     <b>${cm(d(sh, elb) + d(elb, wr))}</b> cm\n` +
    `thigh         ${cm(d(hip, kn))} cm\n` +
    `shin          ${cm(d(kn, ft))} cm\n` +
    `leg total     <b>${cm(d(hip, kn) + d(kn, ft))}</b> cm\n` +
    `leg / height  <b>${((d(hip, kn) + d(kn, ft)) / H * 100).toFixed(1)}</b> %  (ideal ~47)\n` +
    `shoulder / head <b>${(sh ? Math.abs(sh.x) * 2 / headH : NaN).toFixed(2)}</b>  (ideal ~2.2)`;
}

// ---- camera presets
document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { az = +b.dataset.v * Math.PI / 180; el = 4 * Math.PI / 180; cam(); });
const ZOOM = { head: [1.90, 0.80], torso: [1.45, 2.0], hands: [1.05, 1.3], legs: [0.72, 2.2], feet: [0.12, 0.8] };
document.querySelectorAll('[data-z]').forEach(b => b.onclick = () => { const z = ZOOM[b.dataset.z]; tgt.set(0, z[0], 0); dist = z[1]; cam(); });
el$('c_reset').onclick = () => { az = 28 * Math.PI / 180; el = 4 * Math.PI / 180; dist = 5.2; tgt.set(0, 1.04, 0); cam(); };
el$('s_key').oninput = e => { const a = +e.target.value * Math.PI / 180; key.position.set(Math.sin(a) * 3.4, 3.2, Math.cos(a) * 3.4); el$('v_key').textContent = e.target.value + '°'; };
el$('s_exp').oninput = e => { const x = +e.target.value / 100; r.toneMappingExposure = x; key.intensity = 1.15 * x; hemi.intensity = 0.55 * x; fill.intensity = 0.34 * x; rim.intensity = 0.5 * x; el$('v_exp').textContent = x.toFixed(2); };

// ---- controls
let drag = null;
r.domElement.addEventListener('pointerdown', e => { r.domElement.setPointerCapture(e.pointerId); drag = { x: e.clientX, y: e.clientY, pan: e.button === 2 || e.button === 1 || e.shiftKey }; });
r.domElement.addEventListener('pointerup', e => { drag = null; });
r.domElement.addEventListener('pointercancel', () => drag = null);
r.domElement.addEventListener('contextmenu', e => e.preventDefault());
r.domElement.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
  if (drag.pan) {
    const k = dist * 0.0016;
    const right = new THREE.Vector3().setFromMatrixColumn(c.matrix, 0), up = new THREE.Vector3().setFromMatrixColumn(c.matrix, 1);
    tgt.addScaledVector(right, -dx * k).addScaledVector(up, dy * k);
  } else { az -= dx * 0.0075; el = Math.max(-1.45, Math.min(1.45, el + dy * 0.0075)); }
  cam();
});
r.domElement.addEventListener('wheel', e => { e.preventDefault(); dist = Math.max(0.08, Math.min(20, dist * (1 + e.deltaY * 0.0012))); cam(); }, { passive: false });
// double-click: centre on what is under the pointer
r.domElement.addEventListener('dblclick', e => {
  const m = new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight * 2 + -1) * 1);
  const rc = new THREE.Raycaster(); rc.setFromCamera(new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1), c);
  const hit = rc.intersectObjects(ALL().filter(x => x.visible), false)[0];
  if (hit) { tgt.copy(hit.point); dist = Math.max(0.15, dist * 0.55); cam(); }
});
// pinch
let pinch = null;
r.domElement.addEventListener('touchmove', e => {
  if (e.touches.length !== 2) { pinch = null; return; }
  const dx = e.touches[0].clientX - e.touches[1].clientX, dy = e.touches[0].clientY - e.touches[1].clientY, dd = Math.hypot(dx, dy);
  if (pinch) { dist = Math.max(0.08, Math.min(20, dist * pinch / dd)); cam(); }
  pinch = dd;
}, { passive: true });

addEventListener('keydown', e => {
  if (e.key === 'f') el$('c_reset').click();
  if (e.key === 'w') { el$('t_wire').checked = !el$('t_wire').checked; applyShade(); }
  if (e.key === 'b') { el$('t_bones').checked = !el$('t_bones').checked; applyShow(); }
  if (e.key === 'h') el$('ui').style.display = el$('ui').style.display === 'none' ? '' : 'none';
});
addEventListener('resize', () => { r.setSize(innerWidth, innerHeight); c.aspect = innerWidth / innerHeight; c.updateProjectionMatrix(); });

// ---- test hooks
window.__view = (a, e, d, y, x, z) => { if (a != null) az = a * Math.PI / 180; if (e != null) el = e * Math.PI / 180; if (d != null) dist = d; if (y != null) tgt.y = y; if (x != null) tgt.x = x; if (z != null) tgt.z = z; cam(); };
window.__focus = (c, size, k) => { tgt.set(c[0], c[1], c[2]); dist = (size / 2) / Math.tan(c__fov / 2) * (k || 1.7); cam(); };
const c__fov = c.fov * Math.PI / 180;
window.__set = (k, v) => { const n = el$(k); if (!n) return 'no ' + k; if (n.type === 'checkbox') { n.checked = v; n.onchange && n.onchange(); } else { n.value = v; (n.oninput || n.onchange) && (n.oninput ? n.oninput({ target: n }) : n.onchange()); } return k + '=' + v; };
window.__save = async (name) => { r.render(s, c); const d = r.domElement.toDataURL('image/jpeg', 0.92); await fetch('/shot?' + name, { method: 'POST', body: d }); return name; };

window.__motion = async (id, frame) => { if (!MO.clip || MO.clip.id !== id) await setMotion(id); if (frame != null) moFrame(frame); return MO.clip ? MO.clip.id + ' @ ' + (MO.t * MO.clip.fps).toFixed(1) : 'none'; };   // a clip, held on a frame (or playing when no frame is given)

(function loop(now) { requestAnimationFrame(loop); if (el$('t_spin').checked) { az += 0.0045; cam(); } stepMotion(now || 0); r.render(s, c); })();
</script>
