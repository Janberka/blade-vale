<!doctype html><meta charset=utf-8><title>pieces</title><style>body{margin:0;background:#2a2d33}</style><body></body>
<script src="three.min.js"></script>
<script>
window.addEventListener('load',async()=>{
const q=new URLSearchParams(location.search);const set=q.get('set')||'plate';
const j=await (await fetch('armor/'+set+'/pieces.json?'+Date.now())).json();const bin=await (await fetch('armor/'+set+'/pieces.bin?'+Date.now())).arrayBuffer();
const W=innerWidth||800,H=innerHeight||600;const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(W,H);document.body.appendChild(r.domElement);
const s=new THREE.Scene();s.background=new THREE.Color(0x2a2d33);const c=new THREE.PerspectiveCamera(30,W/H,0.01,100);
const az=(+q.get('az')||25)*Math.PI/180,d=+q.get('d')||9;c.position.set(Math.sin(az)*d,2.2,Math.cos(az)*d);c.lookAt(0,1.6,0);
s.add(new THREE.HemisphereLight(0xffffff,0x334455,1.0));const L=new THREE.DirectionalLight(0xffffff,0.9);L.position.set(2,4,3);s.add(L);
const tex=new THREE.TextureLoader().load('armor/'+set+'/tex.png');tex.flipY=false;
const mat=q.get('n')?new THREE.MeshNormalMaterial():new THREE.MeshStandardMaterial({map:tex,metalness:0.3,roughness:0.6});
// approximate pivot frames of the rig (rest pose): root at 0; upperBody y1.68; shoulders (±0.55,0.80) in ub; elbows -0.46; hips (±0.245,1.52); knees -0.62
const F={faulds:[0,0,0],torso:[0,1.68,0],helm:[0,1.68,0],pauldronL:[0.55,2.48,0],pauldronR:[-0.55,2.48,0],upperArmL:[0.55,2.48,0],upperArmR:[-0.55,2.48,0],forearmL:[0.55,2.02,0],forearmR:[-0.55,2.02,0],thighL:[0.245,1.52,0],thighR:[-0.245,1.52,0],shinL:[0.245,0.90,0],shinR:[-0.245,0.90,0]};
const only=q.get('slot');
for(const [slot,dd] of Object.entries(j.slots)){ if(only&&slot!==only) continue;
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(bin,dd.pos,dd.n*3),3));g.setAttribute('uv',new THREE.BufferAttribute(new Float32Array(bin,dd.uv,dd.n*2),2));g.setIndex(new THREE.BufferAttribute(dd.i32?new Uint32Array(bin,dd.idx,dd.ni):new Uint16Array(bin,dd.idx,dd.ni),1));g.computeVertexNormals();
 const m=new THREE.Mesh(g,mat);m.position.fromArray(F[slot]||[0,0,0]);s.add(m);}
window.__render=()=>r.render(s,c);window.__fit=()=>{r.setSize(innerWidth,innerHeight);c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();};window.__ready=true;
(function loop(){requestAnimationFrame(loop);r.render(s,c);})();
});
</script>
